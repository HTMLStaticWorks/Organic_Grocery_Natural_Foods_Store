<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Organica</title>
  <meta name="description" content="Register your premium Organica account.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="logo" style="display: inline-flex; margin-bottom: 1.5rem;">🌿 Organica</a>
      <h2>Create Account</h2>
      <p>Start receiving regional organic harvests weekly.</p>
    </div>

    <form action="login.html" method="GET">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="(555) 000-0000" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required>
      </div>

      <div class="auth-options" style="justify-content: flex-start; margin-bottom: 1.5rem;">
        <label class="form-checkbox">
          <input type="checkbox" required> I agree to the <a href="#" style="color: var(--accent-color);">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary auth-btn">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </div>

</body>
</html>
